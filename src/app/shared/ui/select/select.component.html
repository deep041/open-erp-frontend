<div class="erp-field">
  <label class="erp-label" [for]="inputId()">
    {{ label() }}
  </label>

  <select class="erp-control" [id]="inputId()" [value]="value ?? ''" [disabled]="disabled"
    (change)="updateValue($any($event.target).value)" (blur)="markTouched()">
    <option value="" disabled>
      {{ placeholder() }}
    </option>

    @for (option of options(); track option.value) {
    <option [value]="option.value" [disabled]="option.disabled ?? false">
      {{ option.label }}
    </option>
    }
  </select>
</div>
