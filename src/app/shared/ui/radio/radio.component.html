<fieldset class="radio-fieldset" [disabled]="disabled">
  @if (label()) {
  <legend class="erp-label">{{ label() }}</legend>
  }

  <div class="radio-options" [class.cards]="variant() === 'card'" [class.compact]="variant() === 'compact'"
    [class.vertical]="vertical()">
    @for (option of options(); track option.value) {
    <label class="radio-option" [class.selected]="value === option.value"
      [class.option-disabled]="disabled || option.disabled">
      <input type="radio" [name]="groupName" [value]="option.value" [checked]="value === option.value"
        [disabled]="disabled || !!option.disabled" (change)="updateValue(option.value)" (blur)="markTouched()" />

      <span class="radio-indicator" aria-hidden="true"></span>

      <span class="radio-content">
        <strong>{{ option.label }}</strong>
        @if (option.description && variant() === 'card') {
        <small>{{ option.description }}</small>
        }
      </span>
    </label>
    }
  </div>
</fieldset>
