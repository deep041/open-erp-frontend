<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
  <div class="toast" [class]="toast.type" [attr.role]="toast.type === 'error'
            ? 'alert' : 'status'">
    <lucide-icon [img]="getIcon(toast.type)" [size]="19" class="toast-icon" />

    <div class="toast-content">
      <strong>{{ toast.title }}</strong>

      @if (toast.message) {
      <p>{{ toast.message }}</p>
      }
    </div>

    <button type="button" aria-label="Dismiss notification" (click)="toastService.dismiss(toast.id)">
      <lucide-icon [img]="X" [size]="16" />
    </button>
  </div>
  }
</div>
