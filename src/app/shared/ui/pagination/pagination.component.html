<div class="pagination">
  <span class="summary">
    @if (total() > 0) {
    Showing {{ start() }}–{{ end() }} of {{ total() }}
    } @else {
    No records
    }
  </span>

  <div class="controls">
    <label for="erp-page-size">Rows per page</label>

    <select id="erp-page-size" [value]="pageSize()" (change)="pageSizeChange.emit(+$any($event.target).value)">
      @for (size of pageSizeOptions(); track size) {
      <option [value]="size">{{ size }}</option>
      }
    </select>

    <button type="button" aria-label="Previous page" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">
      <lucide-icon [img]="ChevronLeft" [size]="17" />
    </button>

    <span class="page-count">
      {{ page() }} / {{ totalPages() }}
    </span>

    <button type="button" aria-label="Next page" [disabled]="page() >= totalPages()"
      (click)="pageChange.emit(page() + 1)">
      <lucide-icon [img]="ChevronRight" [size]="17" />
    </button>
  </div>
</div>
